[package]
name = "pinchy-relay"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json", "query"] }
axum-server = "0.8.0"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
getrandom = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
