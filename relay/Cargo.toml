[package]
name = "pinchy-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "json"] }
axum-server = "0.8.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rustls-acme = { version = "0.15.4", features = ["axum"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = "0.1.19"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
