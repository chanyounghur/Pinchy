name: Build installers and release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs build downloadable artifacts only; they never publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check tag and manifest versions
        run: python3 scripts/check-release.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test selection scrolling
        run: node scripts/test_selection_scroll.mjs
      - name: Build installers
        shell: bash
        env:
          # Ad-hoc signing requires no Apple credentials. It is NOT notarization.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bun run tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Give macOS updater bundles unique architecture names
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          target = os.environ['BUILD_TARGET']
          arch = 'aarch64' if target.startswith('aarch64') else 'x64'
          folder = Path(f'src-tauri/target/{target}/release/bundle/macos')
          for suffix in ['.app.tar.gz', '.app.tar.gz.sig']:
              source = folder / f'Pinchy{suffix}'
              source.rename(folder / f'Pinchy_{arch}{suffix}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: downloaded
          merge-multiple: false
      - name: Validate updater assets and generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py downloaded release-assets "${RELEASE_TAG#v}"
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 앱 내 업데이트

          - 실행 30초 후 및 6시간마다 새 버전을 확인하고 자동 다운로드합니다.
          - 트레이의 설정 패널 열기에서 확인하고, 준비되면 설치하고 재시작할 수 있습니다.
          - 기존 0.2.x 사용자는 한 번 수동 설치해 주세요. 0.3.0부터 앱 내 업데이트가 가능합니다.

          ## 다운로드

          - macOS (Apple Silicon): `*_aarch64.dmg`
          - macOS (Intel): `*_x64.dmg`
          - Windows: `*_x64-setup.exe` 또는 `*.msi`

          코드 서명이 없어서 처음 실행할 때 보안 경고가 뜰 수 있습니다. 해결 방법은 [README](https://github.com/chanyounghur/Pinchy#설치)를 참고하세요.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "Pinchy $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
