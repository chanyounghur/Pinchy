name: Build installers and release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs build downloadable artifacts only; they never publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check tag and manifest versions
        run: python3 scripts/check-release.py
      - name: Test relay server
        run: cargo test --manifest-path relay/Cargo.toml --locked

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test selection scrolling
        run: node scripts/test_selection_scroll.mjs
      - name: Test history retention and local data handling
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --target '${{ matrix.target }}'
      - name: Import persistent macOS signing identity
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh
      - name: Test stable macOS signing identity
        if: runner.os == 'macOS'
        run: |
          for name in true false; do
            cp "/usr/bin/$name" "$RUNNER_TEMP/pinchy-$name"
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --identifier com.chanyounghur.pastel --timestamp=none "$RUNNER_TEMP/pinchy-$name"
            bash scripts/verify-macos-signing.sh "$RUNNER_TEMP/pinchy-$name"
            codesign --display --requirements - "$RUNNER_TEMP/pinchy-$name" > "$RUNNER_TEMP/pinchy-$name.requirements"
          done
          cmp "$RUNNER_TEMP/pinchy-true.requirements" "$RUNNER_TEMP/pinchy-false.requirements"
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-signing.sh 'src-tauri/target/${{ matrix.target }}/release/bundle/macos/Pinchy.app'
      - name: Give macOS updater bundles unique architecture names
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          target = os.environ['BUILD_TARGET']
          arch = 'aarch64' if target.startswith('aarch64') else 'x64'
          folder = Path(f'src-tauri/target/{target}/release/bundle/macos')
          for suffix in ['.app.tar.gz', '.app.tar.gz.sig']:
              source = folder / f'Pinchy{suffix}'
              source.rename(folder / f'Pinchy_{arch}{suffix}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Remove macOS signing keychain
        timeout-minutes: 2
        if: always() && runner.os == 'macOS'
        run: bash scripts/macos-signing.sh cleanup

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: downloaded
          merge-multiple: false
      - name: Validate updater assets and generate latest.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare-release.py downloaded release-assets "${RELEASE_TAG#v}"
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 1.0.0: 모든 기기가 같은 히스토리를 가집니다

          - 기기 간 공유가 **동기화**로 바뀌었습니다. 어느 기기에서 복사하든 연결된 모든 기기의 히스토리에 쌓이고, 지우면 모두에서 지워지고, 다시 복사하면 모두에서 맨 앞으로 올라옵니다. 보낼 항목을 고르는 ⇧↩와 자동 보내기 설정은 없어졌습니다.
          - 연결하면 서버의 히스토리를 모두 받아오고 이 기기에 있던 히스토리도 올라가 합쳐집니다. 이미지가 많으면 첫 동기화에 몇 분 걸릴 수 있습니다.
          - 보관 기간과 최대 용량은 서버가 정해 모든 기기에 적용합니다(기본 30일·1GB). 설정의 **히스토리 보관**에 서버 정책과 사용량이 표시되고, 연결하지 않은 기기는 기존 로컬 설정을 그대로 씁니다. **히스토리 제거**는 모든 기기에서 함께 지웁니다.
          - 비밀번호 관리자처럼 "숨김"으로 표시된 복사는 카드에 **숨김** 배지가 붙고, 서버가 `--sync-concealed`로 허용하지 않으면 복사한 기기에만 남습니다.
          - 설정의 **휴대폰 추가**에서 QR 코드를 만들 수 있습니다. 휴대폰용 Pinchy는 준비 중입니다.

          ## 업데이트 순서

          **1.0.0은 0.x 서버와 호환되지 않습니다.** 서버 컴퓨터에서 `relay/`를 1.0.0으로 먼저 올린 뒤(`./relay/install-macos.sh`) 각 기기를 업데이트하세요. 서버의 기기 목록은 유지되어 다시 연결할 필요가 없고, 전달 대기 중이던 항목만 지워집니다. 서버를 올린 뒤 데스크톱을 올리기 전까지는 설정에 연결 오류가 표시되지만 클립보드 히스토리는 그대로 동작합니다.

          ## 다운로드

          - macOS (Apple Silicon): `Pinchy-버전-macOS.dmg`
          - Windows (x64): `Pinchy-버전-Windows.exe`

          macOS는 자가 서명이며 Apple 공증을 받지 않아 처음 실행할 때 보안 경고가 뜰 수 있습니다. Windows도 신뢰된 배포 서명이 없어 경고가 뜰 수 있습니다. 해결 방법은 [README](https://github.com/chanyounghur/Pinchy#설치)를 참고하세요.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "Pinchy $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
