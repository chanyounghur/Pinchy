name: Build installers and release

on:
  push:
    tags:
      - 'v*.*.0'
  # Manual runs build downloadable artifacts only; they never publish a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check tag and manifest versions
        run: python3 scripts/check-release.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build installers
        shell: bash
        env:
          # Ad-hoc signing requires no Apple credentials. It is NOT notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bun run tauri build --ci --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          path: downloaded
          merge-multiple: true
      - name: Collect all four installers and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          files = [p for p in Path('downloaded').rglob('*') if p.suffix in {'.dmg', '.msi', '.exe'}]
          assert sorted(p.suffix for p in files) == ['.dmg', '.dmg', '.exe', '.msi'], files
          assert len({p.name for p in files}) == 4, 'Duplicate installer filenames'
          out = Path('release-assets')
          out.mkdir()
          sums = []
          for p in sorted(files):
              shutil.copy2(p, out / p.name)
              sums.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 다운로드
          - Apple Silicon Mac: `aarch64.dmg`
          - Intel Mac: `x64.dmg`
          - Windows x64: `setup.exe` (권장) 또는 `.msi` 중 하나
          - 파일 무결성 확인: `SHA256SUMS.txt`

          패널 열기: macOS `Shift + Command + V`, Windows `Ctrl + Shift + V`.
          기존 Pastel 사용자는 Pastel을 종료한 뒤 Pinchy를 실행하세요. 기존 기록·설정은 유지됩니다.

          macOS 파일은 임시 서명(ad-hoc)되었으며 Apple 공증은 받지 않았습니다.
          Windows 설치 파일은 코드 서명되지 않았습니다. 운영체제의 보안 확인이 표시될 수 있습니다.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
            --title "Pinchy $RELEASE_TAG" --notes-file release-notes.md --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
