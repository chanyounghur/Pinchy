[package]
name = "pinchy"
version = "0.3.0"
description = "Clipboard history manager"
authors = ["Chanyoung Hur <ruben@kakao.com>"]
edition = "2021"

[lib]
name = "pinchy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
clipboard-rs = "0.3"
enigo = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle"] }
objc2-app-kit = { version = "0.3", features = [
  "NSWorkspace", "NSRunningApplication", "NSScreen", "NSEvent", "NSApplication", "NSResponder", "NSWindow",
  "NSAnimation", "NSAnimationContext", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext",
  "objc2-core-graphics",
] }
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
